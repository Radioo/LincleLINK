name: release

on:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build LincleLINK.sln -c Release
      - run: dotnet test LincleLINK.sln -c Release --no-build

  publish:
    name: Publish (${{ matrix.rid }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            exe: .exe
            name: LincleLINK-win-x64.exe
          - rid: linux-x64
            os: ubuntu-latest
            exe: ''
            name: LincleLINK-linux-x64
          - rid: osx-x64
            os: macos-latest
            exe: ''
            name: LincleLINK-osx-x64
          - rid: osx-arm64
            os: macos-latest
            exe: ''
            name: LincleLINK-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file
        run: >-
          dotnet publish src/LincleLINK.App -c Release -r ${{ matrix.rid }}
          --self-contained -o artifacts/publish/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:EnableCompressionInSingleFile=true

      - name: Stage executable
        shell: bash
        run: cp artifacts/publish/${{ matrix.rid }}/LincleLINK${{ matrix.exe }} artifacts/publish/${{ matrix.name }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: artifacts/publish/${{ matrix.name }}
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
