name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: 
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LincleLINK.sln

      - name: Build
        run: dotnet build LincleLINK.sln -c Release --no-restore

      - name: Test with coverage
        run: dotnet test LincleLINK.sln -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

      - uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage
          if-no-files-found: error

  ui-test:
    name: UI tests (Windows / Appium)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LincleLINK.sln

      - name: Build
        run: dotnet build LincleLINK.sln -c Release --no-restore

      # WinAppDriver refuses to start unless Windows Developer Mode is enabled.
      - name: Enable Developer Mode
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Install WinAppDriver
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/WinAppDriver/releases/download/v1.2.1/WindowsApplicationDriver_1.2.1.msi" -OutFile "$env:TEMP\WinAppDriver.msi"
          Start-Process msiexec.exe -ArgumentList '/i', "$env:TEMP\WinAppDriver.msi", '/qn' -Wait

      - name: Start WinAppDriver
        run: |
          Start-Process "C:\Program Files (x86)\Windows Application Driver\WinAppDriver.exe"
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:4723/status" -UseBasicParsing | Out-Null
              Write-Host "WinAppDriver is up."
              exit 0
            } catch { Start-Sleep -Seconds 1 }
          }
          Write-Error "WinAppDriver did not become ready within 30s."

      - name: Run UI tests
        env:
          LINCLELINK_UI_TESTS: '1'
          LINCLELINK_UITEST_ARTIFACTS: ${{ github.workspace }}\artifacts\ui-failures
        run: dotnet test tests/LincleLINK.UITests/LincleLINK.UITests.csproj -c Release --no-build --logger "trx;LogFileName=ui-tests.trx" --results-directory artifacts/ui-results

      # Screenshots + UIA tree dumps from failed tests, plus the trx log.
      - name: Upload UI test artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-artifacts
          path: |
            artifacts/ui-failures
            artifacts/ui-results
          if-no-files-found: ignore
